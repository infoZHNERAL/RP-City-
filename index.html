<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZHNERAL RP | OPEN WORLD</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91b9ce;font-family:Tahoma,Arial}
canvas{display:block;width:100%;height:100%;touch-action:none}
#loading{position:fixed;inset:0;background:#10151d;color:white;display:grid;place-content:center;text-align:center;z-index:99}
#loading h1{color:#ff303b}
#loading p{font-size:13px;color:#bbb}
#hud{position:fixed;inset:0;pointer-events:none;color:white}
.logo{position:absolute;top:12px;right:12px;background:#101820dd;border:1px solid #ff3545;padding:10px 13px;border-radius:10px;font-weight:bold}
.stats{position:absolute;top:12px;left:12px;background:#101820dd;padding:10px;border-radius:10px;font-size:12px;line-height:2}
.bar{height:6px;width:100px;background:#333;border-radius:10px;overflow:hidden}
.bar span{display:block;width:100%;height:100%;background:#25db75}
#message{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:#101820dd;padding:10px 14px;border-radius:8px;white-space:nowrap;font-size:12px;opacity:0;transition:.2s}
#controls{position:fixed;inset:0;pointer-events:none}
#pad{position:absolute;bottom:24px;left:20px;width:145px;height:145px;pointer-events:auto}
.key{position:absolute;width:48px;height:48px;background:#111c2bba;border:1px solid #ffffff77;border-radius:13px;color:white;font-size:22px;display:grid;place-items:center;user-select:none;touch-action:none}
#up{top:0;left:49px}#down{bottom:0;left:49px}#left{top:49px;left:0}#right{top:49px;right:0}
#actions{position:absolute;bottom:35px;right:18px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
.action{width:65px;height:55px;border-radius:16px;border:1px solid #ff5964;background:#a51e2cdd;color:white;font-weight:bold;touch-action:none}
#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:white;text-shadow:0 2px 5px #000;white-space:nowrap}
</style>
</head>

<body>

<div id="loading">
<h1>ZHNERAL RP</h1>
<div>در حال ساخت شهر سه‌بعدی...</div>
<p>لطفاً کمی صبر کن</p>
</div>

<div id="hud">
<div class="logo">🔴 ZHNERAL RP</div>
<div class="stats">
<div>❤️ سلامتی</div>
<div class="bar"><span></span></div>
<div>💵 پول: $2,500</div>
<div id="speed">🚶 سرعت: 0</div>
</div>
<div id="message"></div>
</div>

<div id="controls">
<div id="pad">
<div class="key" id="up">▲</div>
<div class="key" id="down">▼</div>
<div class="key" id="left">◀</div>
<div class="key" id="right">▶</div>
</div>
<div id="actions">
<button class="action" id="jump">پرش</button>
<button class="action" id="vehicle">سوار ماشین</button>
<button class="action" id="run">دویدن</button>
</div>
<div id="hint">برای حرکت از دکمه‌ها استفاده کن | دوربین با کشیدن صفحه می‌چرخد</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const loading=document.getElementById('loading');
const message=document.getElementById('message');
const speedText=document.getElementById('speed');

function say(text){
 message.textContent=text;
 message.style.opacity=1;
 clearTimeout(window.msgTimer);
 window.msgTimer=setTimeout(()=>message.style.opacity=0,2200);
}

try{

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc7df);
scene.fog=new THREE.Fog(0x9bc7df,100,330);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,700);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9efff,0x69705a,2));

const sun=new THREE.DirectionalLight(0xffe7c3,3);
sun.position.set(-60,100,45);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;
scene.add(sun);

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});

const grass=mat(0x6f9b58);
const roadMat=mat(0x343a40);
const sidewalk=mat(0xb8b8ae);
const white=mat(0xf3f0d9);
const dark=mat(0x252a31);
const glass= new THREE.MeshStandardMaterial({
 color:0x83c8df,metalness:.25,roughness:.25
});

function box(w,h,d,material,x,y,z,shadows=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 m.castShadow=shadows;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

function cylinder(radius,height,material,x,y,z,segments=12){
 const m=new THREE.Mesh(
  new THREE.CylinderGeometry(radius,radius,height,segments),
  material
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 scene.add(m);
 return m;
}

// زمین
box(600,1,600,grass,0,-.55,0,false);

// خیابان‌های اصلی
for(let i=-4;i<=4;i++){
 const p=i*38;

 box(12,.12,600,roadMat,p,.02,0,false);
 box(600,.12,12,roadMat,0,.025,p,false);

 for(let z=-285;z<300;z+=12){
  box(.16,.025,4,white,p,.1,z,false);
 }
 for(let x=-285;x<300;x+=12){
  box(4,.025,.16,white,x,.1,p,false);
 }

 box(15,.18,600,sidewalk,p+7,.08,0,false);
 box(15,.18,600,sidewalk,p-7,.08,0,false);
 box(600,.18,15,sidewalk,0,.08,p+7,false);
 box(600,.18,15,sidewalk,0,.08,p-7,false);
}

// پنجره‌ها
const windowMats=[
 mat(0x8bd0e6,.3),mat(0x395b71,.35),mat(0xf2dca1,.3)
];

function building(x,z,w,d,h,type){
 const colors=[
  0xd9c9ae,0xc2c6ca,0xb4a18a,0xe4dfd2,
  0xb8c7c5,0xd4b6a0,0x858e9b,0xc7b9a3,
  0xe5d2b5,0x9faeb2,0xc8c5bb
 ];

 const baseY=.2;
 const body=box(w,h,d,mat(colors[type%colors.length]),x,baseY+h/2,z);

 // طبقه‌های ساختمانی
 for(let y=3;y<h-1;y+=3.3){
  box(w+.08,.13,d+.08,mat(0xeee8dc),x,baseY+y,z,false);
 }

 // پنجره‌های چهار طرف
 const rows=Math.max(1,Math.floor(h/3.3));
 const cols=Math.max(1,Math.floor(w/2.5));

 for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
   const yy=baseY+1.8+r*3.3;
   if(yy>baseY+h-1)continue;

   const xx=x-w/2+(c+.5)*w/cols;
   const zz=z-d/2+(c+.5)*d/cols;

   box(.85,1.25,.07,windowMats[(type+c+r)%3],xx,yy,z-d/2-.04,false);
   box(.85,1.25,.07,windowMats[(type+c+r+1)%3],xx,yy,z+d/2+.04,false);

   box(.07,1.25,.85,windowMats[(type+r+c)%3],x-w/2-.04,yy,zz,false);
   box(.07,1.25,.85,windowMats[(type+r+c+1)%3],x+w/2+.04,yy,zz,false);
  }
 }

 // سقف متفاوت
 if(type%3===0){
  box(w*.7,1,d*.7,mat(0x555b63),x,baseY+h+.5,z);
 }else if(type%3===1){
  box(w*.5,.6,d*.5,mat(0xa4b3b8),x,baseY+h+.3,z);
 }
}

// ساخت محله‌ها
let seed=493;
function random(){
 seed=(seed*16807)%2147483647;
 return (seed-1)/2147483646;
}

for(let gx=-4;gx<=4;gx++){
 for(let gz=-4;gz<=4;gz++){
  const centerX=gx*38;
  const centerZ=gz*38;

  // ساختمان‌ها در دو طرف خیابان
  for(let side of [-1,1]){
   for(let k=0;k<2;k++){
    const x=centerX+side*(11+k*7);
    const z=centerZ+(k===0?-10:10);

    if(Math.abs(gx)<=1 && Math.abs(gz)<=1 && random()<.4)continue;

    const w=5+random()*4;
    const d=6+random()*5;
    const h=7+Math.floor(random()*9)*2.3;
    const type=Math.floor(random()*11);

    building(x,z,w,d,h,type);
   }
  }
 }
}

// درخت
function tree(x,z,s=1){
 const trunk=mat(0x765036);
 const leaves=[
  mat(0x347a3d),mat(0x438a42),mat(0x598f46)
 ];

 cylinder(.35*s,2.5*s,trunk,x,1.25*s,z,8);

 for(let i=0;i<3;i++){
  const crown=new THREE.Mesh(
   new THREE.IcosahedronGeometry((1.5-i*.15)*s,1),
   leaves[i]
  );
  crown.position.set(x,(2.6+i*.65)*s,z);
  crown.castShadow=true;
  scene.add(crown);
 }
}

// پارک مرکزی
box(48,.2,48,mat(0x5e9a55),0,.16,0);

for(let i=-2;i<=2;i++){
 for(let j=-2;j<=2;j++){
  if(Math.abs(i)+Math.abs(j)>3)continue;
  tree(i*8+2,j*8+2,.8+random()*.3);
 }
}

// مسیرهای پارک
box(3,.22,44,mat(0xd2c5a7),0,.28,0,false);
box(44,.22,3,mat(0xd2c5a7),0,.29,0,false);

// نیمکت‌ها
const wood=mat(0x81512d);
for(let i=0;i<8;i++){
 const x=(i%4)*10-15;
 const z=i<4?-14:14;
 box(2.5,.3,.7,wood,x,.8,z);
 box(.25,.8,.25,dark,x-1,.4,z);
 box(.25,.8,.25,dark,x+1,.4,z);
}

// درخت‌های خیابان
for(let gx=-4;gx<=4;gx++){
 for(let gz=-4;gz<=4;gz++){
  const x=gx*38,z=gz*38;
  for(const off of [-9,9]){
   if(random()>.25)tree(x+off,z-9,.8+random()*.4);
   if(random()>.25)tree(x-9,z+off,.8+random()*.4);
  }
 }
}

// تابلوها
function sign(x,z,text,color=0x2465a8){
 box(2.8,.18,.15,mat(color),x,3,z);
 const pole=box(.12,3,.12,dark,x,1.5,z);
}

// مغازه‌ها و مکان‌های ویژه
function shop(x,z,name,color){
 box(9,5,8,mat(color),x,2.7,z);
 box(9.2,.45,8.2,mat(0xeee4d0),x,5.2,z);
 box(6,1.3,.15,mat(0x24303a),x,4.2,z-4.08);
 box(3.8,1,.1,mat(0xffffff),x,4.2,z-4.18);
 sign(x,z-4.5,name,color);
}

shop(19,19,'RESTAURANT',0xb74b36);
shop(-19,19,'MARKET',0x3d865a);
shop(19,-19,'HOSPITAL',0xe8e9e7);
shop(-19,-19,'POLICE',0x3d587f);

// چراغ خیابان
const lampMat=mat(0x262d34);
const bulbMat=new THREE.MeshStandardMaterial({
 color:0xffe6a0,emissive:0xffbd53,emissiveIntensity:1.4
});

for(let gx=-4;gx<=4;gx++){
 for(let gz=-4;gz<=4;gz++){
  for(const s of [-1,1]){
   const x=gx*38+s*8;
   const z=gz*38+8;

   cylinder(.09,4,lampMat,x,2,z,8);
   box(.8,.12,.12,lampMat,x+.3,4,z);
   box(.5,.15,.3,bulbMat,x+.65,3.9,z);
  }
 }
}

// شخصیت بازیکن
const player=new THREE.Group();
scene.add(player);

const skin=mat(0xe5b38b);
const shirt=mat(0x252d3b);
const pants=mat(0x273e5a);
const shoe=mat(0x17191d);

const body= new THREE.Mesh(new THREE.CapsuleGeometry(.48,.8,4,8),shirt);
body.position.y=1.45;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(new THREE.SphereGeometry(.35,16,12),skin);
head.position.y=2.35;
head.castShadow=true;
player.add(head);

const hair=new THREE.Mesh(
 new THREE.SphereGeometry(.36,12,8,0,Math.PI*2,0,Math.PI*.55),
 dark
);
hair.position.y=2.48;
player.add(hair);

const legs=[];
const arms=[];

for(let s of [-1,1]){
 const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.6,3,7),pants);
 leg.position.set(s*.24,.63,0);
 leg.castShadow=true;
 player.add(leg);
 legs.push(leg);

 const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.65,3,7),skin);
 arm.position.set(s*.57,1.5,0);
 arm.castShadow=true;
 player.add(arm);
 arms.push(arm);

 const foot=box(.35,.2,.55,shoe,s*.24,.16,-.1);
 player.remove(foot);
 player.add(foot);
}

player.position.set(0,0,10);

// ماشین‌ها
const cars=[];
const carColors=[0xc93338,0xeeeeee,0x2671b9,0x20262e,0xe0b43d,0x32946e];

function createCar(x,z,color,rotation=0){
 const car=new THREE.Group();
 scene.add(car);
 car.position.set(x,0,z);
 car.rotation.y=rotation;

 const carBody=box(2.2,.75,4.2,mat(color),0,.8,0);
 const carRoof=box(1.6,.8,1.9,glass,0,1.45,-.2);

 carBody.position.set(0,.8,0);
 carRoof.position.set(0,1.45,-.2);

 car.add(carBody,carRoof);

 const wheels=[];
 for(const xx of [-1,1]){
  for(const zz of [-1.35,1.35]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.38,.38,.22,12),
    dark
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(xx*1.05,.4,zz);
   wheel.castShadow=true;
   car.add(wheel);
   wheels.push(wheel);
  }
 }

 const lightMat=new THREE.MeshStandardMaterial({
  color:0xffffff,emissive:0xffffff,emissiveIntensity:.8
 });

 for(const xx of [-.7,.7]){
  const lamp=box(.4,.22,.12,lightMat,xx,.9,-2.12);
  car.add(lamp);
 }

 cars.push({group:car,wheels});
 return car;
}

for(let i=0;i<24;i++){
 const road=(Math.floor(random()*9)-4)*38;
 const z=(random()-.5)*520;
 const x=(random()>.5?1:-1)*5;

 createCar(road+x,z,carColors[i%carColors.length],0);
}

for(let i=0;i<18;i++){
 const road=(Math.floor(random()*9)-4)*38;
 const x=(random()-.5)*520;
 const z=road+(random()>.5?1:-1)*5;

 createCar(x,z,carColors[(i+2)%carColors.length],Math.PI/2);
}

// کنترل‌ها
const keys={};
const keyMap={
 ArrowUp:'up',w:'up',
 ArrowDown:'down',s:'down',
 ArrowLeft:'left',a:'left',
 ArrowRight:'right',d:'right',
 Shift:'run', ' ':'jump'
};

addEventListener('keydown',e=>{
 const k=keyMap[e.key]||e.key;
 keys[k]=true;
 if(e.key===' ')e.preventDefault();
});

addEventListener('keyup',e=>{
 const k=keyMap[e.key]||e.key;
 keys[k]=false;
});

function bind(id,key){
 const el=document.getElementById(id);

 const start=e=>{
  e.preventDefault();
  keys[key]=true;
 };
 const stop=e=>{
  e.preventDefault();
  keys[key]=false;
 };

 el.addEventListener('pointerdown',start);
 el.addEventListener('pointerup',stop);
 el.addEventListener('pointercancel',stop);
 el.addEventListener('pointerleave',stop);
}

bind('up','up');
bind('down','down');
bind('left','left');
bind('right','right');

let running=false;
let inCar=false;
let currentCar=null;
let verticalSpeed=0;
let onGround=true;
let angle=0;
let camPitch=.22;
let speed=0;

// چرخش دوربین با لمس صفحه
let dragging=false;
let lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
});

addEventListener('pointerup',()=>dragging=false);
addEventListener('pointercancel',()=>dragging=false);

addEventListener('pointermove',e=>{
 if(!dragging)return;

 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;

 angle-=dx*.006;
 camPitch=Math.max(-.1,Math.min(.8,camPitch+dy*.004));

 lastX=e.clientX;
 lastY=e.clientY;
});

// پرش
document.getElementById('jump').addEventListener('pointerdown',e=>{
 e.preventDefault();

 if(!inCar && onGround){
  verticalSpeed=7;
  onGround=false;
 }
});

document.getElementById('run').addEventListener('pointerdown',()=>{
 running=true;
});
document.getElementById('run').addEventListener('pointerup',()=>{
 running=false;
});
document.getElementById('run').addEventListener('pointercancel',()=>{
 running=false;
});

// ورود و خروج از ماشین
document.getElementById('vehicle').addEventListener('click',()=>{
 if(inCar){
  player.position.copy(currentCar.position);
  player.position.x+=3;
  player.visible=true;
  currentCar=null;
  inCar=false;
  say('از ماشین پیاده شدی');
  return;
 }

 let closest=null;
 let distance=6;

 for(const car of cars){
  const d=car.group.position.distanceTo(player.position);
  if(d<distance){
   distance=d;
   closest=car;
  }
 }

 if(closest){
  currentCar=closest.group;
  inCar=true;
  player.visible=false;
  say('سوار ماشین شدی!');
 }else{
  say('به یک ماشین نزدیک شو');
 }
});

const clock=new THREE.Clock();
let elapsed=0;

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);
 elapsed+=dt;

 let moving=false;

 if(inCar && currentCar){
  const forward=(keys.up?1:0)-(keys.down?1:0);
  const turn=(keys.left?1:0)-(keys.right?1:0);

  if(Math.abs(forward)>.01){
   currentCar.rotation.y+=turn*dt*1.5*Math.sign(forward);

   const direction=new THREE.Vector3(
    -Math.sin(currentCar.rotation.y),0,
    -Math.cos(currentCar.rotation.y)
   );

   currentCar.position.addScaledVector(direction,forward*dt*13);
   moving=true;
  }

  player.position.copy(currentCar.position);
  speedText.textContent='🚗 سرعت: '+(moving?'40':'0');

 }else{
  const forward=(keys.up?1:0)-(keys.down?1:0);
  const turn=(keys.left?1:0)-(keys.right?1:0);

  if(forward!==0){
   angle+=turn*dt*1.8;

   const direction=new THREE.Vector3(
    -Math.sin(angle),0,-Math.cos(angle)
   );

   const velocity=running?12:6;
   player.position.addScaledVector(direction,forward*velocity*dt);
   moving=true;
  }else if(turn!==0){
   angle+=turn*dt*1.8;
  }

  if(!onGround){
   verticalSpeed-=18*dt;
   player.position.y+=verticalSpeed*dt;

   if(player.position.y<=0){
    player.position.y=0;
    verticalSpeed=0;
    onGround=true;
   }
  }

  player.rotation.y=angle;
  body.position.y=1.45+(moving?Math.sin(elapsed*12)*.05:0);

  legs.forEach((leg,i)=>{
   leg.rotation.x=moving?Math.sin(elapsed*12+i*Math.PI)*.55:0;
  });

  arms.forEach((arm,i)=>{
   arm.rotation.x=moving?Math.sin(elapsed*12+i*Math.PI+Math.PI)*.35:0;
  });

  speedText.textContent='🚶 سرعت: '+(moving?(running?'12':'6'):'0');
 }

 // دوربین سوم‌شخص
 const target=inCar&&currentCar?currentCar.position:player.position;

 const distance=inCar?10:7;
 const height=inCar?4:3.4;

 const camX=target.x+Math.sin(angle)*distance*Math.cos(camPitch);
 const camZ=target.z+Math.cos(angle)*distance*Math.cos(camPitch);
 const camY=target.y+height+Math.sin(camPitch)*distance;

 camera.position.lerp(new THREE.Vector3(camX,camY,camZ),1-Math.exp(-5*dt));
 camera.lookAt(target.x,target.y+(inCar?1:1.4),target.z);

 // انیمیشن چرخ‌ها
 for(const car of cars){
  if(car.wheels){
   car.wheels.forEach(w=>{
    if(moving && car.group===currentCar)w.rotation.x+=dt*8;
   });
  }
 }

 // محدودیت شهر
 player.position.x=THREE.MathUtils.clamp(player.position.x,-285,285);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-285,285);

 renderer.render(scene,camera);
}

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

loading.style.display='none';
animate();

}catch(error){
 loading.innerHTML=
 '<h1>خطا در اجرای بازی</h1>'+
 '<p>اینترنت را بررسی کن و صفحه را دوباره باز کن.</p>'+
 '<p style="max-width:300px;direction:ltr;overflow-wrap:anywhere">'+
 String(error).slice(0,220)+'</p>';
 console.error(error);
}

</script>
</body>
</html>
