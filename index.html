<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ZHNERAL RP | Open World</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #10151b;
  font-family: Tahoma, Arial, sans-serif;
  color: white;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
  text-align: center;
  background: radial-gradient(circle, #242b35, #07090d 75%);
}

#loading h1 {
  color: #ff3434;
  font-size: 30px;
  margin: 0 0 12px;
  text-shadow: 0 0 20px #ff1717;
}

#loading p {
  color: #ddd;
  font-size: 13px;
  line-height: 2;
  max-width: 340px;
}

.loader {
  width: 45px;
  height: 45px;
  border: 4px solid #333;
  border-top-color: #ff3030;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 15px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#topbar {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
}

.panel {
  background: rgba(8, 12, 18, 0.82);
  border: 1px solid rgba(255,255,255,.17);
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: 0 5px 20px rgba(0,0,0,.35);
  backdrop-filter: blur(8px);
}

#brand {
  font-size: 15px;
  font-weight: bold;
  color: #ff4a4a;
}

#status {
  font-size: 11px;
  margin-top: 5px;
  color: #d7e2ec;
}

#controlsInfo {
  font-size: 10px;
  color: #ddd;
  line-height: 1.8;
  text-align: right;
}

#bottomButtons {
  position: fixed;
  left: 12px;
  bottom: 18px;
  z-index: 30;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.gameButton {
  min-width: 88px;
  border: 1px solid rgba(255,255,255,.24);
  border-radius: 13px;
  color: white;
  background: rgba(12,16,22,.83);
  padding: 12px 13px;
  font-weight: bold;
  font-size: 12px;
  box-shadow: 0 5px 15px #0005;
  touch-action: manipulation;
}

.gameButton:active {
  transform: scale(.95);
  background: #9e2222;
}

#joystick {
  position: fixed;
  width: 132px;
  height: 132px;
  left: 22px;
  bottom: 20px;
  z-index: 25;
  border-radius: 50%;
  background: rgba(10,15,22,.35);
  border: 2px solid rgba(255,255,255,.28);
  touch-action: none;
  display: none;
}

#stick {
  position: absolute;
  width: 53px;
  height: 53px;
  left: 37px;
  top: 37px;
  border-radius: 50%;
  background: rgba(240,240,240,.6);
  border: 2px solid rgba(255,255,255,.8);
  box-shadow: 0 0 15px #0008;
}

#touchActions {
  position: fixed;
  right: 15px;
  bottom: 24px;
  z-index: 30;
  display: none;
  flex-direction: column;
  gap: 12px;
}

.actionButton {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  color: white;
  font-size: 12px;
  font-weight: bold;
  background: rgba(13,18,25,.72);
  border: 2px solid rgba(255,255,255,.45);
  touch-action: none;
}

#message {
  position: fixed;
  left: 50%;
  bottom: 160px;
  transform: translateX(-50%);
  z-index: 40;
  max-width: 85%;
  padding: 10px 15px;
  border-radius: 10px;
  background: rgba(0,0,0,.78);
  color: white;
  font-size: 12px;
  text-align: center;
  display: none;
}

@media (pointer: coarse) {
  #joystick { display: block; }
  #touchActions { display: flex; }
  #bottomButtons { bottom: 165px; }
  #controlsInfo { display: none; }
}

@media (max-width: 420px) {
  #brand { font-size: 12px; }
  .panel { padding: 8px; }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="loading">
  <h1>ZHNERAL RP</h1>
  <div class="loader"></div>
  <p id="loadMessage">در حال بارگذاری موتور سه‌بعدی...</p>
</div>

<div id="topbar">
  <div class="panel">
    <div id="brand">ZHNERAL RP | OPEN WORLD</div>
    <div id="status">در حال آماده‌سازی شهر...</div>
  </div>

  <div class="panel" id="controlsInfo">
    حرکت: W A S D<br>
    دویدن: Shift<br>
    چرخش دوربین: حرکت ماوس
  </div>
</div>

<div id="bottomButtons">
  <button class="gameButton" id="cameraButton">تغییر دوربین</button>
  <button class="gameButton" id="runButton">دویدن: خاموش</button>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="touchActions">
  <button class="actionButton" id="touchRun">دویدن</button>
  <button class="actionButton" id="touchCamera">دوربین</button>
</div>

<div id="message"></div>

<script type="module">
const $ = id => document.getElementById(id);

function showError(error) {
  console.error(error);

  $('loading').style.display = 'flex';
  $('loadMessage').textContent =
    'بازی بارگذاری نشد. اینترنت را بررسی کن و صفحه را دوباره باز کن. ' +
    (error && error.message ? error.message : '');
}

window.addEventListener('error', event => {
  console.error(event.error);
});

window.addEventListener('unhandledrejection', event => {
  console.error(event.reason);
});

async function loadThree() {
  const sources = [
    'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js',
    'https://unpkg.com/three@0.170.0/build/three.module.js'
  ];

  let lastError;

  for (const source of sources) {
    try {
      return await import(source);
    } catch (error) {
      lastError = error;
    }
  }

  throw lastError || new Error('موتور سه‌بعدی دریافت نشد.');
}

try {
  const THREE = await loadThree();
  $('loadMessage').textContent = 'در حال ساخت شهر سه‌بعدی...';
  startGame(THREE);
} catch (error) {
  showError(error);
}

function startGame(THREE) {
  const canvas = $('game');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9bb9d1);
  scene.fog = new THREE.Fog(0x9bb9d1, 100, 370);

  const camera = new THREE.PerspectiveCamera(
    68,
    window.innerWidth / window.innerHeight,
    0.1,
    700
  );

  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: window.devicePixelRatio < 2,
    powerPreference: 'high-performance'
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  scene.add(new THREE.HemisphereLight(0xdceaff, 0x606052, 2.0));

  const sun = new THREE.DirectionalLight(0xfff0d5, 2.8);
  sun.position.set(-70, 120, 60);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -120;
  sun.shadow.camera.right = 120;
  sun.shadow.camera.top = 120;
  sun.shadow.camera.bottom = -120;
  sun.shadow.bias = -0.0004;
  scene.add(sun);

  const mat = (color, roughness = 0.85, metalness = 0) =>
    new THREE.MeshStandardMaterial({
      color,
      roughness,
      metalness
    });

  const materials = {
    grass: mat(0x63834b),
    grass2: mat(0x78965a),
    road: mat(0x30343a),
    sidewalk: mat(0xb4b2aa),
    line: mat(0xe8dfb7),
    white: mat(0xecece7),
    black: mat(0x171a20),
    glass: new THREE.MeshStandardMaterial({
      color: 0x66899b,
      roughness: 0.22,
      metalness: 0.4
    }),
    windowLight: mat(0xe2cfa0),
    red: mat(0xc92d2d),
    blue: mat(0x2864a7),
    yellow: mat(0xe6b52b),
    concrete: mat(0x929493),
    treeLeaf: mat(0x286a3c),
    treeLeaf2: mat(0x3e8246),
    trunk: mat(0x65422a),
    park: mat(0x477b43),
    water: new THREE.MeshStandardMaterial({
      color: 0x4ca7d1,
      roughness: 0.22,
      metalness: 0.25
    })
  };

  const world = new THREE.Group();
  scene.add(world);

  const colliders = [];
  const clock = new THREE.Clock();

  function addBox(
    x, y, z,
    width, height, depth,
    material,
    collision = false,
    options = {}
  ) {
    const geometry = new THREE.BoxGeometry(width, height, depth);
    const mesh = new THREE.Mesh(geometry, material);

    mesh.position.set(x, y + height / 2, z);
    mesh.castShadow = options.castShadow !== false;
    mesh.receiveShadow = true;

    world.add(mesh);

    if (collision) {
      colliders.push({
        x,
        z,
        halfX: width / 2,
        halfZ: depth / 2
      });
    }

    return mesh;
  }

  function addCylinder(
    x, y, z,
    radiusTop, radiusBottom, height,
    material,
    collision = false,
    segments = 10
  ) {
    const geometry = new THREE.CylinderGeometry(
      radiusTop,
      radiusBottom,
      height,
      segments
    );

    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y + height / 2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    world.add(mesh);

    if (collision) {
      colliders.push({
        x,
        z,
        halfX: radiusBottom,
        halfZ: radiusBottom
      });
    }

    return mesh;
  }

  function addSphere(x, y, z, radius, material, segments = 10) {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(radius, segments, segments),
      material
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    world.add(mesh);
    return mesh;
  }

  function addTextBoard(x, y, z, width, height, text, color = '#ffffff') {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 180;

    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#151a20';
    ctx.fillRect(0, 0, 512, 180);

    ctx.fillStyle = color;
    ctx.fillRect(0, 0, 512, 7);

    ctx.fillStyle = color;
    ctx.font = 'bold 58px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 256, 95);

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;

    const board = new THREE.Mesh(
      new THREE.PlaneGeometry(width, height),
      new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
      })
    );

    board.position.set(x, y, z);
    world.add(board);

    return board;
  }

  // زمین اصلی شهر
  addBox(0, -1, 0, 420, 1, 420, materials.grass);

  // آسفالت خیابان‌های اصلی
  const roadWidth = 12;
  const blockGap = 46;
  const roadPositions = [-92, -46, 0, 46, 92];

  roadPositions.forEach(position => {
    addBox(position, 0.01, 0, roadWidth, 0.08, 390, materials.road);
    addBox(0, 0.015, position, 390, 0.08, roadWidth, materials.road);

    // خط‌کشی خیابان
    for (let n = -180; n <= 180; n += 12) {
      addBox(
        position, 0.07, n,
        0.16, 0.025, 4.3,
        materials.line,
        false,
        { castShadow: false }
      );

      addBox(
        n, 0.07, position,
        4.3, 0.025, 0.16,
        materials.line,
        false,
        { castShadow: false }
      );
    }

    // پیاده‌روهای دو طرف خیابان
    addBox(
      position - 7.4, 0.03, 0,
      2.4, 0.2, 390,
      materials.sidewalk
    );

    addBox(
      position + 7.4, 0.03, 0,
      2.4, 0.2, 390,
      materials.sidewalk
    );

    addBox(
      0, 0.03, position - 7.4,
      390, 0.2, 2.4,
      materials.sidewalk
    );

    addBox(
      0, 0.03, position + 7.4,
      390, 0.2, 2.4,
      materials.sidewalk
    );
  });

  // ساختمان‌های متنوع
  const buildingColors = [
    0xd1c4ad,
    0xb9c5ce,
    0xc7b5a3,
    0xb8b7b1,
    0xaaa8a0,
    0xc9c9c0,
    0xd4c9b7,
    0x9daeb7,
    0xe0d8cb,
    0xa9b8a5
  ].map(color => mat(color));

  const roofMaterials = [
    mat(0x4b4a48),
    mat(0x6b4b3b),
    mat(0x353b42),
    mat(0x77736c)
  ];

  function addBuilding(x, z, w, d, h, style) {
    const baseY = 0.1;
    const color = buildingColors[
      Math.floor(Math.random() * buildingColors.length)
    ];

    // بدنه
    addBox(x, baseY, z, w, h, d, color, true);

    // سقف
    addBox(
      x, baseY + h, z,
      w + 0.5, 0.4, d + 0.5,
      roofMaterials[style % roofMaterials.length],
      true
    );

    // پنجره‌ها در نمای جلو
    const frontZ = z + d / 2 + 0.035;
    const floors = Math.max(1, Math.floor(h / 3.2));
    const windows = Math.max(2, Math.floor(w / 2.5));

    for (let floor = 0; floor < floors; floor++) {
      for (let win = 0; win < windows; win++) {
        const wx = x - w / 2 + (win + 0.5) * (w / windows);
        const wy = baseY + 1.25 + floor * (h / floors);

        if (wy > baseY + h - 0.5) continue;

        addBox(
          wx, wy, frontZ,
          Math.min(1.15, w / windows * 0.55),
          Math.min(1.5, h / floors * 0.52),
          0.08,
          Math.random() > 0.82
            ? materials.windowLight
            : materials.glass
        );
      }
    }

    // پنجره‌های نمای کناری
    const sideX = x + w / 2 + 0.035;
    const sideWindows = Math.max(2, Math.floor(d / 3));

    for (let floor = 0; floor < floors; floor++) {
      for (let win = 0; win < sideWindows; win++) {
        const wz = z - d / 2 + (win + 0.5) * (d / sideWindows);
        const wy = baseY + 1.25 + floor * (h / floors);

        if (wy > baseY + h - 0.5) continue;

        addBox(
          sideX, wy, wz,
          0.08,
          Math.min(1.4, h / floors * 0.5),
          Math.min(1.2, d / sideWindows * 0.5),
          materials.glass
        );
      }
    }

    // ورودی ساختمان
    addBox(
      x, baseY, z + d / 2 + 0.08,
      Math.min(2.1, w * 0.28),
      Math.min(2.8, h * 0.45),
      0.12,
      materials.black
    );

    // بعضی ساختمان‌ها بالکن دارند
    if (style % 3 === 0 && h > 9) {
      for (let floor = 1; floor < floors; floor += 2) {
        addBox(
          x, baseY + floor * (h / floors), z + d / 2 + 0.6,
          w * 0.7, 0.15, 1.2,
          materials.concrete
        );
      }
    }

    // کولر روی پشت‌بام
    if (style % 2 === 0) {
      addBox(
        x - w * 0.22, baseY + h + 0.4, z,
        1.5, 0.8, 1.3,
        materials.concrete,
        true
      );
    }
  }

  // ساخت بلوک‌های شهر
  const blocks = [-69, -23, 23, 69];

  blocks.forEach((bx, ix) => {
    blocks.forEach((bz, iz) => {
      // یک بلوک مرکزی برای فضای باز و پارک
      if (ix === 2 && iz === 2) return;

      // هر بلوک چند ساختمان با اندازه و ارتفاع مختلف
      const positions = [
        [-8, -8],
        [8, -8],
        [-8, 8],
        [8, 8]
      ];

      positions.forEach((offset, index) => {
        const x = bx + offset[0];
        const z = bz + offset[1];

        // بعضی قطعه‌ها عمداً خالی می‌مانند
        if (Math.random() < 0.15) return;

        const w = 8 + Math.random() * 4;
        const d = 8 + Math.random() * 4;
        const h = 8 + Math.random() * 25;
        const style = Math.floor(Math.random() * 8);

        addBuilding(x, z, w, d, h, style);
      });
    });
  });

  // درخت‌ها
  function addTree(x, z, scale = 1) {
    addCylinder(
      x, 0.15, z,
      0.3 * scale, 0.42 * scale, 2.4 * scale,
      materials.trunk,
      true,
      8
    );

    addSphere(
      x, 2.6 * scale, z,
      1.45 * scale,
      materials.treeLeaf,
      9
    );

    addSphere(
      x - 0.55 * scale, 2.85 * scale, z + 0.2 * scale,
      0.95 * scale,
      materials.treeLeaf2,
      8
    );

    addSphere(
      x + 0.5 * scale, 2.95 * scale, z - 0.2 * scale,
      0.9 * scale,
      materials.treeLeaf,
      8
    );
  }

  // پارک بزرگ
  const parkX = 69;
  const parkZ = 69;

  addBox(
    parkX, 0.08, parkZ,
    32, 0.12, 32,
    materials.park
  );

  // مسیرهای داخل پارک
  addBox(
    parkX, 0.16, parkZ,
    4, 0.06, 31,
    materials.sidewalk
  );

  addBox(
    parkX, 0.17, parkZ,
    31, 0.06, 4,
    materials.sidewalk
  );

  // حوض پارک
  addBox(
    parkX + 7, 0.19, parkZ - 7,
    7, 0.12, 6,
    materials.water
  );

  // نیمکت‌های پارک
  for (let i = 0; i < 6; i++) {
    const x = parkX - 11 + i * 4.3;
    const z = parkZ + 9;

    addBox(x, 0.7, z, 2.5, 0.2, 0.8, materials.trunk, true);
    addBox(x, 0.25, z, 0.2, 0.5, 0.2, materials.black, true);
    addBox(x + 1.8, 0.25, z, 0.2, 0.5, 0.2, materials.black, true);
  }

  for (let i = 0; i < 12; i++) {
    const angle = i / 12 * Math.PI * 2;
    addTree(
      parkX + Math.cos(angle) * 13,
      parkZ + Math.sin(angle) * 13,
      0.85 + Math.random() * 0.3
    );
  }

  // درخت‌های کنار خیابان
  roadPositions.forEach(position => {
    for (let n = -165; n <= 165; n += 23) {
      if (Math.abs(position) === 92 && Math.abs(n) < 30) continue;

      addTree(position + 9.8, n, 0.7);
      addTree(position - 9.8, n + 8, 0.72);
    }
  });

  // چراغ‌های خیابان
  function addStreetLight(x, z, rotate = false) {
    addCylinder(
      x, 0.1, z,
      0.1, 0.13, 5,
      materials.black,
      true,
      8
    );

    if (rotate) {
      addBox(x - 0.6, 4.8, z, 1.4, 0.12, 0.12, materials.black, true);
      addBox(x - 1.1, 4.55, z, 0.7, 0.22, 0.4, materials.windowLight);
    } else {
      addBox(x, 4.8, z - 0.6, 0.12, 0.12, 1.4, materials.black, true);
      addBox(x, 4.55, z - 1.1, 0.4, 0.22, 0.7, materials.windowLight);
    }
  }

  roadPositions.forEach(position => {
    for (let n = -160; n <= 160; n += 40) {
      addStreetLight(position + 9.2, n);
      addStreetLight(n, position - 9.2, true);
    }
  });

  // مغازه‌ها و رستوران
  function addShop(x, z, name, color, width = 11, depth = 8) {
    addBox(x, 0.1, z, width, 4.6, depth, mat(color), true);

    addBox(
      x, 4.7, z,
      width + 0.8, 0.4, depth + 0.8,
      materials.black,
      true
    );

    // شیشه جلوی مغازه
    addBox(
      x - width * 0.18, 1.1, z + depth / 2 + 0.06,
      width * 0.45, 1.7, 0.1,
      materials.glass
    );

    addBox(
      x + width * 0.23, 1.1, z + depth / 2 + 0.06,
      width * 0.28, 1.7, 0.1,
      materials.glass
    );

    addBox(
      x, 2.95, z + depth / 2 + 0.1,
      width * 0.9, 0.9, 0.16,
      materials.black
    );

    addTextBoard(
      x, 3.05, z + depth / 2 + 0.2,
      width * 0.82, 0.65, name, '#ffdb78'
    );

    // سایه‌بان
    addBox(
      x, 2.2, z + depth / 2 + 0.55,
      width, 0.15, 1,
      materials.red,
      true
    );
  }

  addShop(-69, -69, 'RESTAURANT', 0xa64a31);
  addShop(-23, -69, 'CAFE', 0x76513b);
  addShop(23, -69, 'MARKET', 0x447c5c);
  addShop(69, -69, 'CLOTHES', 0x60508d);

  addShop(-69, 23, 'PIZZA', 0xc58b38);
  addShop(-23, 69, 'GENERAL', 0x8d3030);
  addShop(23, 23, 'GARAGE', 0x536a7c);

  // پمپ بنزین
  function addGasStation(x, z) {
    addBox(
      x, 0.1, z,
      22, 0.2, 16,
      materials.concrete
    );

    addBox(
      x, 5.4, z,
      22, 0.5, 16,
      materials.red,
      true
    );

    // پایه‌های سقف
    [
      [-9, -6],
      [9, -6],
      [-9, 6],
      [9, 6]
    ].forEach(offset => {
      addBox(
        x + offset[0], 0.2, z + offset[1],
        0.6, 5.2, 0.6,
        materials.white,
        true
      );
    });

    // دستگاه‌های بنزین
    for (let i = 0; i < 3; i++) {
      const px = x - 5 + i * 5;

      addBox(
        px, 0.2, z,
        1.5, 2.1, 1.2,
        materials.white,
        true
      );

      addBox(
        px, 1.7, z + 0.64,
        0.9, 0.6, 0.08,
        materials.black
      );

      addBox(
        px + 0.8, 1.2, z + 0.7,
        0.08, 1.1, 0.08,
        materials.black
      );
    }

    addTextBoard(
      x, 7, z - 7.8,
      9, 2,
      'GAS STATION',
      '#ff4242'
    );
  }

  addGasStation(0, -115);

  // ماشین‌های پارک‌شده
  const carColors = [
    0xb92828,
    0x235ca2,
    0xd6d5ce,
    0x252a31,
    0xd5a62a,
    0x28734e,
    0x9b9b9b
  ].map(color => mat(color, 0.4, 0.15));

  function addCar(x, z, colorIndex, rotation = 0) {
    const car = new THREE.Group();
    car.position.set(x, 0.15, z);
    car.rotation.y = rotation;

    const color = carColors[colorIndex % carColors.length];

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(2.15, 0.8, 4.2),
      color
    );

    body.position.y = 0.75;
    body.castShadow = true;
    body.receiveShadow = true;
    car.add(body);

    const cabin = new THREE.Mesh(
      new THREE.BoxGeometry(1.7, 0.75, 2.1),
      materials.glass
    );

    cabin.position.set(0, 1.45, -0.15);
    cabin.castShadow = true;
    car.add(cabin);

    const front = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.25, 0.2),
      materials.white
    );

    front.position.set(0, 0.85, 2.12);
    car.add(front);

    const rear = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.25, 0.2),
      materials.red
    );

    rear.position.set(0, 0.85, -2.12);
    car.add(rear);

    // چهار چرخ
    [
      [-1.05, 0.45, -1.25],
      [1.05, 0.45, -1.25],
      [-1.05, 0.45, 1.25],
      [1.05, 0.45, 1.25]
    ].forEach(position => {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.42, 0.22, 12),
        materials.black
      );

      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(position[0], position[1], position[2]);
      wheel.castShadow = true;
      car.add(wheel);
    });

    world.add(car);

    // محدوده برخورد ماشین
    colliders.push({
      x,
      z,
      halfX: rotation === 0 ? 1.35 : 2.3,
      halfZ: rotation === 0 ? 2.3 : 1.35
    });
  }

  const parkedCars = [
    [-84, -60, 0, 0],
    [-84, -49, 1, 0],
    [-84, -38, 2, 0],
    [-38, -84, 3, Math.PI / 2],
    [-27, -84, 4, Math.PI / 2],
    [38, -84, 5, Math.PI / 2],
    [49, -84, 0, Math.PI / 2],
    [84, -60, 6, 0],
    [84, -49, 2, 0],
    [84, -38, 1, 0],
    [-84, 38, 4, 0],
    [-84, 49, 3, 0],
    [38, 84, 1, Math.PI / 2],
    [49, 84, 5, Math.PI / 2],
    [-38, 84, 6, Math.PI / 2],
    [-27, 84, 2, Math.PI / 2]
  ];

  parkedCars.forEach(car => {
    addCar(car[0], car[1], car[2], car[3]);
  });

  // سطل زباله و موانع کوچک
  function addBin(x, z) {
    addCylinder(
      x, 0.1, z,
      0.38, 0.42, 0.95,
      materials.blue,
      true,
      10
    );

    addCylinder(
      x, 1.05, z,
      0.43, 0.43, 0.12,
      materials.black,
      true,
      10
    );
  }

  addBin(-58, -58);
  addBin(-12, -58);
  addBin(34, -58);
  addBin(80, -12);
  addBin(-80, 34);

  // شخصیت بازیکن
  const player = new THREE.Group();
  scene.add(player);

  const skin = mat(0xe1b18a);
  const shirt = mat(0x1c2636);
  const pants = mat(0x252b34);
  const shoes = mat(0x111111);

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42, 0.5, 1.05, 12),
    shirt
  );

  body.position.y = 1.2;
  body.castShadow = true;
  player.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.34, 14, 12),
    skin
  );

  head.position.y = 2.02;
  head.castShadow = true;
  player.add(head);

  const leftLeg = new THREE.Mesh(
    new THREE.BoxGeometry(0.28, 0.65, 0.3),
    pants
  );

  leftLeg.position.set(-0.22, 0.48, 0);
  player.add(leftLeg);

  const rightLeg = leftLeg.clone();
  rightLeg.position.x = 0.22;
  player.add(rightLeg);

  const leftArm = new THREE.Mesh(
    new THREE.BoxGeometry(0.23, 0.8, 0.25),
    shirt
  );

  leftArm.position.set(-0.55, 1.25, 0);
  player.add(leftArm);

  const rightArm = leftArm.clone();
  rightArm.position.x = 0.55;
  player.add(rightArm);

  // نقطه شروع بازیکن
  player.position.set(0, 0.15, 10);

  let yaw = 0;
  let cameraYaw = 0;
  let cameraPitch = 0.18;
  let firstPerson = false;
  let running = false;
  let walking = false;
  let walkTime = 0;

  const keys = {};
  const joystick = { x: 0, y: 0 };

  const PLAYER_RADIUS = 0.72;

  // برخورد با ساختمان‌ها و موانع
  function isBlocked(x, z) {
    for (const obstacle of colliders) {
      const nearestX = Math.max(
        obstacle.x - obstacle.halfX,
        Math.min(x, obstacle.x + obstacle.halfX)
      );

      const nearestZ = Math.max(
        obstacle.z - obstacle.halfZ,
        Math.min(z, obstacle.z + obstacle.halfZ)
      );

      const dx = x - nearestX;
      const dz = z - nearestZ;

      if (
        dx * dx + dz * dz <
        PLAYER_RADIUS * PLAYER_RADIUS
      ) {
        return true;
      }
    }

    // مرزهای شهر
    if (Math.abs(x) > 195 || Math.abs(z) > 195) {
      return true;
    }

    return false;
  }

  function movePlayer(dx, dz) {
    // بررسی محور X و Z جداگانه برای حرکت در کنار دیوار
    const nextX = player.position.x + dx;

    if (!isBlocked(nextX, player.position.z)) {
      player.position.x = nextX;
    }

    const nextZ = player.position.z + dz;

    if (!isBlocked(player.position.x, nextZ)) {
      player.position.z = nextZ;
    }
  }

  // کنترل کیبورد
  window.addEventListener('keydown', event => {
    keys[event.key.toLowerCase()] = true;

    if (
      ['w', 'a', 's', 'd', 'arrowup', 'arrowdown',
       'arrowleft', 'arrowright', ' '].includes(
        event.key.toLowerCase()
      )
    ) {
      event.preventDefault();
    }

    if (event.key === 'Shift') {
      running = true;
      updateRunButton();
    }
  });

  window.addEventListener('keyup', event => {
    keys[event.key.toLowerCase()] = false;

    if (event.key === 'Shift') {
      running = false;
      updateRunButton();
    }
  });

  // تغییر حالت دویدن
  function updateRunButton() {
    $('runButton').textContent =
      'دویدن: ' + (running ? 'روشن' : 'خاموش');
  }

  $('runButton').addEventListener('click', () => {
    running = !running;
    updateRunButton();
  });

  $('touchRun').addEventListener('pointerdown', event => {
    event.preventDefault();
    running = true;
    updateRunButton();
  });

  $('touchRun').addEventListener('pointerup', () => {
    running = false;
    updateRunButton();
  });

  $('touchRun').addEventListener('pointercancel', () => {
    running = false;
    updateRunButton();
  });

  // تغییر دوربین
  function toggleCamera() {
    firstPerson = !firstPerson;
    $('cameraButton').textContent =
      firstPerson ? 'دوربین سوم‌شخص' : 'دوربین اول‌شخص';
  }

  $('cameraButton').addEventListener('click', toggleCamera);
  $('touchCamera').addEventListener('click', toggleCamera);

  // دسته لمسی
  const joystickElement = $('joystick');
  const stickElement = $('stick');

  let joystickPointer = null;

  function resetJoystick() {
    joystick.x = 0;
    joystick.y = 0;

    stickElement.style.left = '37px';
    stickElement.style.top = '37px';
    joystickPointer = null;
  }

  joystickElement.addEventListener('pointerdown', event => {
    event.preventDefault();

    joystickPointer = event.pointerId;

    if (joystickElement.setPointerCapture) {
      joystickElement.setPointerCapture(event.pointerId);
    }

    updateJoystick(event);
  });

  joystickElement.addEventListener('pointermove', event => {
    if (event.pointerId === joystickPointer) {
      event.preventDefault();
      updateJoystick(event);
    }
  });

  joystickElement.addEventListener('pointerup', event => {
    if (event.pointerId === joystickPointer) {
      resetJoystick();
    }
  });

  joystickElement.addEventListener('pointercancel', resetJoystick);

  function updateJoystick(event) {
    const rect = joystickElement.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = event.clientX - centerX;
    let dy = event.clientY - centerY;

    const max = 39;
    const length = Math.sqrt(dx * dx + dy * dy);

    if (length > max) {
      dx = dx / length * max;
      dy = dy / length * max;
    }

    joystick.x = dx / max;
    joystick.y = dy / max;

    stickElement.style.left = (37 + dx) + 'px';
    stickElement.style.top = (37 + dy) + 'px';
  }

  // کنترل دوربین با لمس و ماوس
  let lookPointer = null;
  let lastLookX = 0;
  let lastLookY = 0;

  renderer.domElement.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' && event.button === 0) {
      lookPointer = event.pointerId;
      lastLookX = event.clientX;
      lastLookY = event.clientY;
    }
  });

  window.addEventListener('pointermove', event => {
    if (event.pointerId === lookPointer) {
      const dx = event.clientX - lastLookX;
      const dy = event.clientY - lastLookY;

      lastLookX = event.clientX;
      lastLookY = event.clientY;

      cameraYaw -= dx * 0.005;
      cameraPitch = Math.max(
        -0.3,
        Math.min(0.8, cameraPitch + dy * 0.003)
      );
    }
  });

  window.addEventListener('pointerup', event => {
    if (event.pointerId === lookPointer) {
      lookPointer = null;
    }
  });

  // در موبایل، لمس سمت راست صفحه دوربین را می‌چرخاند
  let touchLookId = null;
  let touchLookX = 0;
  let touchLookY = 0;

  renderer.domElement.addEventListener('touchstart', event => {
    for (const touch of event.changedTouches) {
      if (touch.clientX > window.innerWidth * 0.45) {
        touchLookId = touch.identifier;
        touchLookX = touch.clientX;
        touchLookY = touch.clientY;
        break;
      }
    }
  }, { passive: true });

  renderer.domElement.addEventListener('touchmove', event => {
    if (touchLookId === null) return;

    for (const touch of event.changedTouches) {
      if (touch.identifier === touchLookId) {
        const dx = touch.clientX - touchLookX;
        const dy = touch.clientY - touchLookY;

        touchLookX = touch.clientX;
        touchLookY = touch.clientY;

        cameraYaw -= dx * 0.006;
        cameraPitch = Math.max(
          -0.3,
          Math.min(0.8, cameraPitch + dy * 0.003)
        );
      }
    }
  }, { passive: true });

  renderer.domElement.addEventListener('touchend', event => {
    for (const touch of event.changedTouches) {
      if (touch.identifier === touchLookId) {
        touchLookId = null;
      }
    }
  }, { passive: true });

  // پیام‌های کوتاه داخل بازی
  let messageTimer = null;

  function showMessage(text) {
    $('message').textContent = text;
    $('message').style.display = 'block';

    clearTimeout(messageTimer);

    messageTimer = setTimeout(() => {
      $('message').style.display = 'none';
    }, 2200);
  }

  // حرکت شخصیت و دوربین
  function updateGame(delta) {
    let forward = 0;
    let sideways = 0;

    if (keys['w'] || keys['arrowup']) forward += 1;
    if (keys['s'] || keys['arrowdown']) forward -= 1;
    if (keys['a'] || keys['arrowleft']) sideways -= 1;
    if (keys['d'] || keys['arrowright']) sideways += 1;

    forward += -joystick.y;
    sideways += joystick.x;

    const inputLength = Math.sqrt(
      forward * forward + sideways * sideways
    );

    walking = inputLength > 0.12;

    if (walking) {
      forward /= Math.max(1, inputLength);
      sideways /= Math.max(1, inputLength);

      const speed = running ? 10.5 : 5.2;

      const directionX =
        Math.sin(cameraYaw) * forward +
        Math.cos(cameraYaw) * sideways;

      const directionZ =
        Math.cos(cameraYaw) * forward -
        Math.sin(cameraYaw) * sideways;

      const dx = directionX * speed * delta;
      const dz = directionZ * speed * delta;

      movePlayer(dx, dz);

      yaw = Math.atan2(directionX, directionZ);
      player.rotation.y = yaw;

      walkTime += delta * (running ? 13 : 8);

      leftLeg.rotation.x = Math.sin(walkTime) * 0.65;
      rightLeg.rotation.x = -Math.sin(walkTime) * 0.65;

      leftArm.rotation.x = -Math.sin(walkTime) * 0.5;
      rightArm.rotation.x = Math.sin(walkTime) * 0.5;
    } else {
      leftLeg.rotation.x *= 0.8;
      rightLeg.rotation.x *= 0.8;
      leftArm.rotation.x *= 0.8;
      rightArm.rotation.x *= 0.8;
    }

    // دوربین اول‌شخص یا سوم‌شخص
    const playerPosition = player.position.clone();

    let cameraPosition;
    let lookPosition;

    if (firstPerson) {
      cameraPosition = new THREE.Vector3(
        playerPosition.x,
        playerPosition.y + 2.0,
        playerPosition.z
      );

      cameraPosition.x -= Math.sin(cameraYaw) * 0.12;
      cameraPosition.z -= Math.cos(cameraYaw) * 0.12;

      lookPosition = cameraPosition.clone();

      lookPosition.x += Math.sin(cameraYaw) * 30;
      lookPosition.y += cameraPitch * 15;
      lookPosition.z += Math.cos(cameraYaw) * 30;
    } else {
      const distance = running ? 8.5 : 7.2;

      cameraPosition = new THREE.Vector3(
        playerPosition.x - Math.sin(cameraYaw) * distance,
        playerPosition.y + 4.0 + cameraPitch * 5,
        playerPosition.z - Math.cos(cameraYaw) * distance
      );

      lookPosition = new THREE.Vector3(
        playerPosition.x,
        playerPosition.y + 1.6,
        playerPosition.z
      );
    }

    camera.position.lerp(cameraPosition, 1 - Math.exp(-6 * delta));
    camera.lookAt(lookPosition);

    $('status').textContent =
      'موقعیت شهر: ' +
      Math.round(player.position.x) + ' ، ' +
      Math.round(player.position.z) +
      ' | ' +
      (walking ? (running ? 'در حال دویدن' : 'در حال راه رفتن') : 'آماده حرکت');
  }

  // نور و مه با پس‌زمینه هماهنگ‌اند
  function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.04);

    updateGame(delta);

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  });

  $('loading').style.display = 'none';

  showMessage('به شهر ZHNERAL RP خوش آمدی!');

  animate();
}
</script>
