<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZHNERAL RP | Open World</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87a9bd;font-family:Tahoma,Arial;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.badge{background:#10151ee8;color:white;border:1px solid #ff263f;border-radius:12px;padding:9px;font-size:11px}
#hint{position:fixed;bottom:155px;left:0;right:0;text-align:center;color:white;text-shadow:0 2px 4px #000;font-size:11px;pointer-events:none}
#controls{position:fixed;bottom:20px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-end;z-index:8;pointer-events:none}
#joy{width:124px;height:124px;border-radius:50%;background:#10151b99;border:2px solid #ffffff85;position:relative;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:50px;height:50px;border-radius:50%;background:#ff263f;border:2px solid white;left:35px;top:35px}
#buttons{display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.action{min-width:88px;height:50px;border-radius:12px;background:#10151fee;border:1px solid #ffffff80;color:white;font-size:12px}
#reset{position:fixed;right:12px;bottom:12px;z-index:9;background:#111d;color:white;border:1px solid #ffffff70;padding:8px;border-radius:8px}
#loading{position:fixed;inset:0;z-index:20;background:#080b10;color:white;display:flex;align-items:center;justify-content:center;text-align:center}
#loading div{padding:25px;line-height:2}
@media(min-width:700px){#joy{width:140px;height:140px}#stick{left:43px;top:43px}#hint{bottom:175px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div><h2 style="color:#ff263f">ZHNERAL RP</h2>در حال ساخت شهر سه‌بعدی...</div></div>
<div id="top">
<div class="badge">ZHNERAL RP<br>OPEN WORLD</div>
<div class="badge" id="coords">X 0 | Z 0</div>
</div>
<div id="hint">با دسته حرکت کن و در سمت راست صفحه انگشتت را بکش تا دوربین بچرخد.</div>
<div id="controls">
<div id="joy"><div id="stick"></div></div>
<div id="buttons">
<button class="action" id="run">🏃 دویدن: خاموش</button>
<button class="action" id="view">🎥 تغییر دوربین</button>
</div>
</div>
<button id="reset">شروع دوباره</button>

<script type="module">
const $=id=>document.getElementById(id);
let THREE,scene,camera,renderer,player,clock;
let joyX=0,joyY=0,angle=0,running=false,firstPerson=false;
let elapsed=0,rotating=false,lastX=0;
const obstacles=[];

async function start(){
try{
THREE=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
init();
}catch(e){
$('loading').innerHTML='<div>موتور سه‌بعدی بارگذاری نشد.<br>اینترنت را بررسی و صفحه را تازه‌سازی کن.</div>';
}
}

function material(color,roughness=.85){
return new THREE.MeshStandardMaterial({color,roughness});
}

function box(w,h,d,color,x,y,z,parent=scene,collision=false){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
m.position.set(x,y,z);
m.castShadow=false;
m.receiveShadow=false;
parent.add(m);
if(collision)obstacles.push({x,z,w,d});
return m;
}

function ground(w,d,color,x,z){
const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({color}));
m.rotation.x=-Math.PI/2;
m.position.set(x,.015,z);
scene.add(m);
}

function building(x,z,w,d,floors,color,style=0){
const g=new THREE.Group();
g.position.set(x,0,z);
const h=floors*3;
box(w,h,d,color,0,h/2,0,g,true);
box(w+.3,.35,d+.3,0x66696b,0,.18,0,g);

for(let f=0;f<floors;f++){
for(let side of [-1,1]){
const cols=Math.max(2,Math.floor(w/2.6));
for(let i=0;i<cols;i++){
const wx=-w/2+(i+.5)*w/cols;
box(w/cols*.57,1.35,.08,style===1?0x7b6047:0x274558,wx,f*3+1.55,side*(d/2+.05),g);
}
}
}

if(style===0){
box(w+.4,.35,d+.4,0x44494d,0,h+.15,0,g);
box(1.4,2.1,.12,0x543b2b,0,1.05,d/2+.08,g);
}else if(style===1){
box(w+.5,.3,d+.5,0x9d3935,0,h+.15,0,g);
box(1.5,1.7,.1,0x4d3827,0,.85,d/2+.08,g);
}else{
box(w+.8,.6,d+.8,0x313c48,0,h+.3,0,g);
box(2.2,1.8,.12,0x9b292e,0,.9,d/2+.08,g);
}
scene.add(g);
}

function tree(x,z,s=1){
const g=new THREE.Group();
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.23*s,1.5*s,7),material(0x70452a));
trunk.position.y=.75*s;g.add(trunk);
const leaves=new THREE.Mesh(new THREE.SphereGeometry(1*s,8,7),material(0x347348));
leaves.position.y=1.9*s;g.add(leaves);
const top=new THREE.Mesh(new THREE.SphereGeometry(.68*s,8,6),material(0x48834b));
top.position.y=2.55*s;g.add(top);
g.position.set(x,0,z);scene.add(g);
}

function park(x,z,w=24,d=24){
ground(w,d,0x43834b,x,z);
ground(w*.6,2.2,0xc6bba0,x,z);
ground(2.2,d*.6,0xc6bba0,x,z);
for(let i=0;i<8;i++){
const tx=x-w/2+3+(i%4)*(w-6)/3;
const tz=z-d/2+3+Math.floor(i/4)*(d-6);
tree(tx,tz,.8);
}
for(let i=0;i<3;i++){
box(2,.22,.55,0x765039,x-5+i*5,.4,z+4);
box(.12,.45,.12,0x424242,x-5+i*5,.2,z+4);
}
box(2,.12,2,0x4a9ac1,x+6,.15,z-5);
box(1.5,.1,1.5,0x65b6dc,x+6,.23,z-5);
}

function restaurant(x,z,color=0xc84b38){
const g=new THREE.Group();g.position.set(x,0,z);
box(13,5.5,10,0xe0d5bd,0,2.75,0,g,true);
box(13.5,.5,10.5,color,0,5.7,0,g);
box(4,2.5,.12,0x24566c,-3,2.1,5.06,g);
box(4,2.5,.12,0x24566c,3,2.1,5.06,g);
box(1.4,2.7,.15,0x543b2b,0,1.35,5.1,g);
box(13,.65,.2,color,0,4.8,5.15,g);
for(let i=0;i<3;i++){
box(1.2,.12,1.2,0x69452f,-4+i*4,.8,8,g);
box(.12,.9,.12,0x414141,-4+i*4,.4,8,g);
box(.12,.9,.12,0x414141,-4+i*4+1,.4,8,g);
}
scene.add(g);
}

function gasStation(x,z){
const g=new THREE.Group();g.position.set(x,0,z);
box(24,.15,23,0xb8b9b4,0,.07,0,g);
box(8,4,6,0xe0ded6,-7,2,-5,g,true);
box(8,.4,6.2,0xd12c3a,-7,4.2,-5,g);
box(15,.4,10,0xe2e2dc,3,4.3,0,g);
for(const px of [-3,9])for(const pz of [-4,4])box(.3,4,.3,0xd1d2d0,px,2,pz,g);
for(const px of [0,5]){
box(1.1,1.8,1.1,0xd1d5d7,px,1,0,g);
box(.8,.4,.12,0x233746,px,1.4,.57,g);
}
scene.add(g);
}

function car(x,z,color,rotation=0){
const g=new THREE.Group();
box(2,.7,4,color,0,.8,0,g);
box(1.5,.7,2,0x324b5b,0,1.45,0,g);
for(const sx of [-1,1])for(const sz of [-1,1]){
const w=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.2,10),material(0x171717));
w.rotation.z=Math.PI/2;w.position.set(sx*1.02,.4,sz*1.25);g.add(w);
}
g.position.set(x,0,z);g.rotation.y=rotation;scene.add(g);
obstacles.push({x,z,w:2.7,d:4.7});
}

function createCity(){
const colors=[0xc6b8a8,0xa9bac2,0xd8d2c6,0x929fa8,0xc3c9c9,0xbca99b,0x8a9aab];
for(let bx=-3;bx<=3;bx++){
for(let bz=-3;bz<=3;bz++){
const x=bx*55,z=bz*55;
const n=Math.abs(bx*7+bz*11+30);
if(n%5===0){
park(x,z,30,29);
continue;
}
if(n%7===0){
restaurant(x,z, n%2?0xc84836:0x287c66);
continue;
}
if(n%4===0){
building(x-9,z,12,12,1,0xd5c9b8,1);
building(x+10,z,14,12,2,0xc5bba9,1);
continue;
}
if(n%3===0){
building(x-10,z-8,15,13,4,colors[n%colors.length],0);
building(x+10,z+9,13,14,6,colors[(n+2)%colors.length],2);
}else{
building(x-10,z-9,12,12,3+n%5,colors[n%colors.length],0);
building(x+10,z+10,13,13,5+(n%4),colors[(n+3)%colors.length],2);
}
}
}
}

function createStreets(){
ground(450,450,0x66815b,0,0);
box(450,.18,450,0x989a92,0,-.09,0);
for(let p=-165;p<=165;p+=55){
ground(450,14,0x30343a,0,p);
ground(14,450,0x30343a,p,0);
for(let s of [-1,1]){
ground(450,.35,0xe0d7c3,0,p+s*7.5);
ground(.35,450,0xe0d7c3,p+s*7.5,0);
}
for(let n=-210;n<210;n+=12){
ground(3,.15,0xf0e7cc,n,p);
ground(.15,3,0xf0e7cc,p,n);
}
}
}

function createPlayer(){
player=new THREE.Group();
const body=material(0x252b36),pants=material(0x1c2937),skin=material(0xc99572);
box(.7,.9,.4,0x252b36,0,1.25,0,player);
box(.28,.8,.3,0x1c2937,-.18,.4,0,player);
box(.28,.8,.3,0x1c2937,.18,.4,0,player);
const head=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),skin);
head.position.y=1.92;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.25,8,6),material(0x151515));
hair.scale.y=.55;hair.position.y=2.08;player.add(hair);
box(.2,.75,.25,0x252b36,-.48,1.25,0,player);
box(.2,.75,.25,0x252b36,.48,1.25,0,player);
scene.add(player);
}

function blocked(x,z){
for(const o of obstacles){
if(Math.abs(x-o.x)<o.w/2+.45&&Math.abs(z-o.z)<o.d/2+.45)return true;
}
return false;
}

function setupControls(){
const joy=$('joy'),stick=$('stick');
let pointer=null;
function move(e){
const r=joy.getBoundingClientRect();
let dx=e.clientX-(r.left+r.width/2);
let dy=e.clientY-(r.top+r.height/2);
const len=Math.hypot(dx,dy),max=40;
if(len>max){dx=dx/len*max;dy=dy/len*max;}
joyX=dx/max;joyY=dy/max;
stick.style.left=(joy.clientWidth/2-25+dx)+'px';
stick.style.top=(joy.clientHeight/2-25+dy)+'px';
}
joy.addEventListener('pointerdown',e=>{pointer=e.pointerId;joy.setPointerCapture(pointer);move(e);});
joy.addEventListener('pointermove',e=>{if(e.pointerId===pointer)move(e);});
function release(){
pointer=null;joyX=joyY=0;
stick.style.left=(joy.clientWidth/2-25)+'px';
stick.style.top=(joy.clientHeight/2-25)+'px';
}
joy.addEventListener('pointerup',release);
joy.addEventListener('pointercancel',release);

$('run').onclick=()=>{running=!running;$('run').textContent=running?'🏃 دویدن: روشن':'🏃 دویدن: خاموش';};
$('view').onclick=()=>{firstPerson=!firstPerson;};

$('reset').onclick=()=>{
player.position.set(0,0,0);player.rotation.y=0;angle=0;
camera.position.set(0,7,12);
};

renderer.domElement.addEventListener('pointerdown',e=>{
if(e.clientX<innerWidth*.4)return;
rotating=true;lastX=e.clientX;
});
addEventListener('pointermove',e=>{
if(!rotating)return;
angle-=(e.clientX-lastX)*.008;
lastX=e.clientX;
});
addEventListener('pointerup',()=>rotating=false);
addEventListener('pointercancel',()=>rotating=false);
}

function init(){
scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bbdd5);
scene.fog=new THREE.Fog(0x9bbdd5,170,430);
camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,900);
renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.3));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
$('game').appendChild(renderer.domElement);
clock=new THREE.Clock();

scene.add(new THREE.HemisphereLight(0xe6f3ff,0x5b5548,2));
const sun=new THREE.DirectionalLight(0xffe6c1,2);
sun.position.set(-80,150,70);scene.add(sun);

createStreets();
createCity();
park(-45,0,30,28);
park(70,45,32,30);
park(65,-75,30,28);
restaurant(30,0,0xc84b38);
restaurant(-75,50,0x287b65);
gasStation(45,15);
car(12,-30,0xb5212c);
car(-12,35,0x315d86);
car(40,-55,0xeeeeee);
createPlayer();
setupControls();

function resize(){
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);
resize();
$('loading').style.display='none';
animate();
}

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.05);
elapsed+=dt;

const speed=(running?10:5)*dt;
const forward=-joyY,side=joyX;
const dx=Math.sin(angle)*forward+Math.cos(angle)*side;
const dz=Math.cos(angle)*forward-Math.sin(angle)*side;
const nx=player.position.x+dx*speed;
const nz=player.position.z+dz*speed;

if(Math.abs(joyX)>.05||Math.abs(joyY)>.05){
if(!blocked(nx,player.position.z))player.position.x=nx;
if(!blocked(player.position.x,nz))player.position.z=nz;
player.rotation.y=Math.atan2(dx,dz);
}

player.position.x=THREE.MathUtils.clamp(player.position.x,-205,205);
player.position.z=THREE.MathUtils.clamp(player.position.z,-205,205);

const target=new THREE.Vector3(player.position.x,firstPerson?1.65:1.6,player.position.z);
if(firstPerson){
camera.position.set(target.x-Math.sin(angle)*.15,target.y,target.z-Math.cos(angle)*.15);
}else{
const desired=new THREE.Vector3(
target.x+Math.sin(angle)*8,
target.y+5.5,
target.z+Math.cos(angle)*8
);
camera.position.lerp(desired,1-Math.pow(.001,dt));
}
camera.lookAt(
target.x+Math.sin(angle)*10,
target.y,
target.z+Math.cos(angle)*10
);
$('coords').textContent='X '+Math.round(player.position.x)+' | Z '+Math.round(player.position.z);
renderer.render(scene,camera);
}
start();
</script>
</body>
</html>
